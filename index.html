<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL EXCHANGE PRO - WALLET</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:white;font-family:Arial}
header{background:#151a25;padding:20px;border-bottom:2px solid #d4aa45}
h1,.gold{color:#e5bd59}
main{max-width:850px;margin:auto;padding:15px}
.card{background:#151a25;border:1px solid #49402e;border-radius:12px;padding:18px;margin:12px 0}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:7px;border:1px solid #444;background:#090d16;color:white}
button{background:#b58b32;color:#080b12;font-weight:bold;cursor:pointer}
.secondary{background:#303746;color:white}
.danger{background:#9d3434;color:white}
.hidden{display:none}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{flex:1}
.stat{font-size:30px;color:#e5bd59;font-weight:bold}
.user{padding:12px;background:#202635;border-radius:8px;margin:8px 0}
#message{color:#e5bd59;white-space:pre-wrap}
small{color:#aaa}
</style>
</head>
<body>

<header>
<h1>ROYAL EXCHANGE PRO</h1>
WALLET MANAGEMENT SYSTEM
</header>

<main>
<div id="message"></div>

<section id="login" class="card">
<h2 class="gold">Welcome</h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<button class="secondary" onclick="register()">CREATE USER ACCOUNT</button>
</section>

<section id="dashboard" class="hidden">
<nav id="navigation"></nav>

<div id="home" class="card">
<h2 class="gold">My Wallet</h2>
<p>Available Demo Balance</p>
<div class="stat" id="balance">0.00</div>
<small>Virtual demo credits only</small>
</div>

<div id="wallet" class="card hidden">
<h2 class="gold">Wallet Transactions</h2>
<div id="transactions"></div>
</div>

<div id="admin" class="card hidden">
<h2 class="gold">Admin Panel</h2>
<p>Total Users: <b id="totalUsers">0</b></p>
<div id="userList"></div>
</div>

<button class="danger" onclick="logout()">LOGOUT</button>
</section>
</main>

<script>
let accounts=JSON.parse(localStorage.getItem("royalAccounts")||"{}");
let current="";
let isAdmin=false;

function save(){
 localStorage.setItem("royalAccounts",JSON.stringify(accounts));
}

function message(t){
 document.getElementById("message").textContent=t;
}

function register(){
 let u=prompt("Create username");
 if(!u)return;
 u=u.trim();
 let p=prompt("Create password");
 if(!p)return;

 if(u.toLowerCase()==="admin"||accounts[u]){
  message("Username already exists");
  return;
 }

 accounts[u]={
  password:p,
  balance:0,
  transactions:[]
 };

 save();
 message("Account created. Please login.");
}

function login(){
 let u=document.getElementById("username").value.trim();
 let p=document.getElementById("password").value;

 if(u==="admin" && p==="admin123"){
  current="admin";
  isAdmin=true;
  openDashboard();
  return;
 }

 if(!accounts[u]||accounts[u].password!==p){
  message("Invalid username or password");
  return;
 }

 current=u;
 isAdmin=false;
 openDashboard();
}

function openDashboard(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");

 let nav=document.getElementById("navigation");
 nav.innerHTML="";

 if(isAdmin){
  addNav("ADMIN","admin");
 }else{
  addNav("MY WALLET","home");
  addNav("TRANSACTIONS","wallet");
 }

 refresh();
 show(isAdmin?"admin":"home");
}

function addNav(label,id){
 let b=document.createElement("button");
 b.textContent=label;
 b.onclick=()=>show(id);
 document.getElementById("navigation").appendChild(b);
}

function show(id){
 ["home","wallet","admin"].forEach(x=>{
  document.getElementById(x).classList.add("hidden");
 });
 document.getElementById(id).classList.remove("hidden");

 if(id==="admin")showUsers();
 if(id==="wallet")showTransactions();
}

function refresh(){
 if(!isAdmin && accounts[current]){
  document.getElementById("balance").textContent=
   Number(accounts[current].balance).toFixed(2);
 }
}

function showTransactions(){
 if(isAdmin)return;
 let list=accounts[current].transactions||[];
 document.getElementById("transactions").innerHTML=
 list.length
 ? list.map(x=>"<div class='user'>"+escapeHTML(x)+"</div>").join("")
 : "<p>No transactions yet.</p>";
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function showUsers(){
 if(!isAdmin)return;

 let names=Object.keys(accounts);
 document.getElementById("totalUsers").textContent=names.length;

 let html="";
 names.forEach(u=>{
  html+=`
   <div class="user">
    <b>${escapeHTML(u)}</b>
    <p>Balance: ${Number(accounts[u].balance).toFixed(2)} Demo Credits</p>
    <button onclick="changeBalance('${encodeURIComponent(u)}','add')">
     ADD BALANCE
    </button>
    <button class="secondary"
     onclick="changeBalance('${encodeURIComponent(u)}','deduct')">
     DEDUCT BALANCE
    </button>
   </div>`;
 });

 document.getElementById("userList").innerHTML=
 html||"<p>No users registered.</p>";
}

function changeBalance(encoded,type){
 if(!isAdmin)return;

 let u=decodeURIComponent(encoded);
 let n=Number(prompt("Enter demo credits amount"));

 if(!Number.isFinite(n)||n<=0){
  alert("Invalid amount");
  return;
 }

 if(type==="deduct"&&n>accounts[u].balance){
  alert("Insufficient wallet balance");
  return;
 }

 if(type==="add"){
  accounts[u].balance+=n;
 }else{
  accounts[u].balance-=n;
 }

 let note=(type==="add"?"Admin added ":"Admin deducted ")+
  n.toFixed(2)+" demo credits";

 accounts[u].transactions.unshift(note);
 save();
 showUsers();
 alert("Wallet updated successfully");
}

function logout(){
 current="";
 isAdmin=false;
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 message("Logged out");
}
</script>
</body>
</html>
