<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL EXCHANGE PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#eee;font-family:Arial,sans-serif}
header{background:#111;border-bottom:1px solid #b58b32;padding:16px;text-align:center}
h1{color:#e8bd57;font-size:23px;margin:0}
small{color:#aaa}
main{max-width:900px;margin:auto;padding:15px}
.card{background:#151515;border:1px solid #735a28;border-radius:12px;padding:16px;margin:12px 0}
h2,h3{color:#e8bd57}
input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #76602f;background:#090909;color:white}
button{background:#b58b32;color:#111;font-weight:bold;cursor:pointer}
button.secondary{background:#292929;color:#e8bd57}
button.danger{background:#792929;color:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.category{display:inline-block;background:#242016;border:1px solid #9c792e;padding:12px;margin:5px;border-radius:8px}
.hidden{display:none}
.gold{color:#e8bd57}
.balance{font-size:27px;color:#e8bd57;font-weight:bold}
.item{padding:10px;border-bottom:1px solid #333}
#message{padding:10px;color:#e8bd57}
</style>
</head>
<body>
<header>
<h1>ROYAL EXCHANGE PRO</h1>
<small>ULTIMATE DEMO MANAGEMENT SYSTEM</small>
</header>

<main>
<div id="message"></div>

<section id="auth" class="card">
<h2>Login / Register</h2>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<div id="registerFields">
<input id="fullName" placeholder="Full name">
<input id="mobile" placeholder="Mobile number">
</div>
<div class="row">
<button onclick="login()">Login</button>
<button class="secondary" onclick="register()">Register</button>
</div>
</section>

<section id="app" class="hidden">
<div class="card">
<div class="row">
<div>
<h3>Welcome</h3>
<div id="userName">User</div>
</div>
<div>
<button class="secondary" onclick="logout()">Logout</button>
</div>
</div>
<div id="roleLabel" class="gold"></div>
</div>

<div id="userPanel">
<div class="card">
<h2>Account Mode</h2>
<select id="mode" onchange="renderBalance()">
<option value="demo">Demo Account</option>
<option value="original">Original Account – Virtual Points</option>
</select>
<div class="balance" id="balance">0</div>
<small id="balanceLabel">Demo virtual credits</small>
</div>

<div class="card">
<h2>Categories</h2>
<div id="announcement"></div>
<div id="categories"></div>
</div>

<div class="card">
<h2>My Activity</h2>
<div id="transactions">Loading...</div>
</div>
</div>

<div id="adminPanel" class="hidden">
<div class="card">
<h2>Admin Dashboard</h2>
<div id="adminStats">Loading users...</div>
</div>

<div class="card">
<h2>Manage Virtual Credits</h2>
<input id="targetUser" placeholder="User UUID">
<select id="creditMode">
<option value="demo">Demo credits</option>
<option value="original">Original mode virtual points</option>
</select>
<input id="creditAmount" type="number" placeholder="Amount (use minus to deduct)">
<input id="creditNote" placeholder="Reason / note">
<button onclick="adjustCredits()">Update Virtual Balance</button>
</div>

<div class="card">
<h2>Manage Categories</h2>
<input id="catName" placeholder="Category name">
<input id="catDesc" placeholder="Description">
<button onclick="addCategory()">Add Category</button>
<div id="adminCategories"></div>
</div>

<div class="card">
<h2>Announcement</h2>
<input id="announcementInput" placeholder="Announcement">
<button onclick="saveAnnouncement()">Save Announcement</button>
</div>

<div class="card">
<h2>Recent Transactions</h2>
<div id="adminTransactions">Loading...</div>
</div>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://lsuscsonxyomusbpzxxt.supabase.co";
const SUPABASE_KEY = "sb_publishable_p2Lhw8xmGstxTUq2S-T-rg_5licR3Hq";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
let currentProfile=null;
let wallet=null;
let categories=[];

function msg(t){
 document.getElementById("message").textContent=t;
}
function el(id){return document.getElementById(id)}

async function register(){
 const email=el("email").value.trim();
 const password=el("password").value;
 const full_name=el("fullName").value.trim();
 const mobile=el("mobile").value.trim();

 if(!email||password.length<6){
  msg("Email aur minimum 6-character password daalo.");
  return;
 }

 const {data,error}=await db.auth.signUp({
  email,password,
  options:{data:{full_name,mobile}}
 });
 if(error){msg(error.message);return;}
 msg("Registration request complete. Email verification required ho sakti hai.");
 if(data.session) await startApp();
}

async function login(){
 const {data,error}=await db.auth.signInWithPassword({
  email:el("email").value.trim(),
  password:el("password").value
 });
 if(error){msg(error.message);return;}
 await startApp();
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 currentProfile=null;
 el("app").classList.add("hidden");
 el("auth").classList.remove("hidden");
 msg("Logged out.");
}

async function startApp(){
 const {data:{user}}=await db.auth.getUser();
 if(!user)return;
 currentUser=user;

 const {data:profile,error}=await db.from("profiles")
  .select("*").eq("id",user.id).single();

 if(error){msg(error.message);return;}
 currentProfile=profile;

 el("auth").classList.add("hidden");
 el("app").classList.remove("hidden");
 el("userName").textContent=profile.full_name||user.email;
 el("roleLabel").textContent=profile.role==="admin"?"ADMIN PANEL ACCESS":"USER PANEL";
 el("adminPanel").classList.toggle("hidden",profile.role!=="admin");

 await loadWallet();
 await loadCategories();
 await loadSettings();
 await loadTransactions();

 if(profile.role==="admin"){
  await loadAdmin();
 }

 subscribeRealtime();
 msg("Welcome to ROYAL EXCHANGE PRO");
}

async function loadWallet(){
 const {data,error}=await db.from("wallets")
  .select("*").eq("user_id",currentUser.id).maybeSingle();
 if(error){msg(error.message);return;}
 wallet=data||{demo_balance:0,original_points:0};
 renderBalance();
}

function renderBalance(){
 if(!wallet)return;
 const mode=el("mode").value;
 const amount=mode==="demo"?wallet.demo_balance:wallet.original_points;
 el("balance").textContent=Number(amount||0).toFixed(2);
 el("balanceLabel").textContent=
 mode==="demo"?"Demo virtual credits":"Original mode – non-redeemable virtual points";
}

async function loadCategories(){
 const {data,error}=await db.from("panel_categories")
  .select("*").eq("is_visible",true).order("sort_order");
 if(error){msg(error.message);return;}
 categories=data||[];
 el("categories").innerHTML=categories.map(c=>
  `<span class="category">${escapeHtml(c.name)}</span>`
 ).join("")||"No categories available.";
 if(currentProfile.role==="admin")renderAdminCategories();
}

async function loadSettings(){
 const {data}=await db.from("site_settings").select("*").eq("id",1).single();
 if(data){
  el("announcement").textContent=data.announcement||"";
  el("announcementInput").value=data.announcement||"";
 }
}

async function loadTransactions(){
 const {data,error}=await db.from("wallet_transactions")
  .select("*").eq("user_id",currentUser.id)
  .order("created_at",{ascending:false}).limit(30);
 if(error){el("transactions").textContent=error.message;return;}
 el("transactions").innerHTML=(data||[]).map(t=>
 `<div class="item">${escapeHtml(t.account_mode)} | ${Number(t.amount).toFixed(2)} | ${escapeHtml(t.note||"")}<br><small>${new Date(t.created_at).toLocaleString()}</small></div>`
 ).join("")||"No activity yet.";
}

async function loadAdmin(){
 const {data:users,error}=await db.from("profiles")
  .select("id,full_name,mobile,role,created_at")
  .order("created_at",{ascending:false}).limit(100);
 if(error){msg(error.message);return;}

 el("adminStats").innerHTML=`Total registered users shown: ${users.length}`;
 el("adminStats").innerHTML+=users.map(u=>
 `<div class="item">
 <b>${escapeHtml(u.full_name||"User")}</b> – ${escapeHtml(u.mobile||"")}
 <br><small>UUID: ${u.id}</small>
 <br><small>Role: ${u.role}</small>
 <button class="secondary" onclick="copyUserId('${u.id}')">Copy User UUID</button>
 </div>`
 ).join("");

 const {data:tx}=await db.from("wallet_transactions")
  .select("*").order("created_at",{ascending:false}).limit(50);
 el("adminTransactions").innerHTML=(tx||[]).map(t=>
 `<div class="item">${escapeHtml(t.account_mode)} | ${Number(t.amount).toFixed(2)} | ${escapeHtml(t.note||"")}<br><small>User: ${t.user_id}</small></div>`
 ).join("")||"No transactions.";
 await loadCategories();
}

function copyUserId(id){
 if(navigator.clipboard)navigator.clipboard.writeText(id);
 msg("User UUID copied.");
}

async function adjustCredits(){
 const userId=el("targetUser").value.trim();
 const amount=Number(el("creditAmount").value);
 const mode=el("creditMode").value;
 const note=el("creditNote").value.trim();

 if(!userId||!amount||!Number.isFinite(amount)){
  msg("User UUID aur valid amount daalo.");
  return;
 }

 const {error}=await db.rpc("admin_adjust_wallet",{
  p_user_id:userId,
  p_mode:mode,
  p_amount:amount,
  p_note:note
 });
 if(error){msg(error.message);return;}
 msg("Virtual balance updated.");
 await loadAdmin();
 await loadTransactions();
}

async function addCategory(){
 const name=el("catName").value.trim();
 const description=el("catDesc").value.trim();
 if(!name){msg("Category name daalo.");return;}

 const {error}=await db.from("panel_categories").insert({
  name,description,is_visible:true
 });
 if(error){msg(error.message);return;}
 el("catName").value="";
 el("catDesc").value="";
 msg("Category added.");
 await loadCategories();
}

async function toggleCategory(id,visible){
 const {error}=await db.from("panel_categories")
  .update({is_visible:!visible}).eq("id",id);
 if(error){msg(error.message);return;}
 await loadCategories();
}

async function deleteCategory(id){
 if(!confirm("Is category ko delete karna hai?"))return;
 const {error}=await db.from("panel_categories").delete().eq("id",id);
 if(error){msg(error.message);return;}
 await loadCategories();
}

async function renderAdminCategories(){
 const {data}=await db.from("panel_categories")
  .select("*").order("sort_order");
 el("adminCategories").innerHTML=(data||[]).map(c=>
 `<div class="item">
 ${escapeHtml(c.name)} – ${c.is_visible?"Visible":"Hidden"}
 <button class="secondary" onclick="toggleCategory(${c.id},${c.is_visible})">${c.is_visible?"Hide":"Show"}</button>
 <button class="danger" onclick="deleteCategory(${c.id})">Delete</button>
 </div>`
 ).join("");
}

async function saveAnnouncement(){
 const announcement=el("announcementInput").value.trim();
 const {error}=await db.from("site_settings")
  .update({announcement,updated_at:new Date().toISOString()})
  .eq("id",1);
 if(error){msg(error.message);return;}
 msg("Announcement updated.");
 await loadSettings();
}

function subscribeRealtime(){
 db.channel("royal-shared-updates")
 .on("postgres_changes",{
  event:"*",schema:"public",table:"panel_categories"
 },()=>loadCategories())
 .on("postgres_changes",{
  event:"*",schema:"public",table:"site_settings"
 },()=>loadSettings())
 .subscribe();

 db.channel("royal-wallet-updates")
 .on("postgres_changes",{
  event:"*",schema:"public",table:"wallets",
  filter:"user_id=eq."+currentUser.id
 },()=>loadWallet())
 .on("postgres_changes",{
  event:"*",schema:"public",table:"wallet_transactions",
  filter:"user_id=eq."+currentUser.id
 },()=>loadTransactions())
 .subscribe();
}

function escapeHtml(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

db.auth.onAuthStateChange((event,session)=>{
 if(session?.user && !currentUser){
  setTimeout(()=>startApp(),0);
 }
});

(async()=>{
 const {data:{session}}=await db.auth.getSession();
 if(session)await startApp();
})();
</script>
</body>
</html>
