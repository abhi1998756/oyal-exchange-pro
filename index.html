<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL EXCHANGE PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:white;font-family:Arial}
header{background:#151a25;padding:20px;border-bottom:2px solid #d4aa45}
h1,.gold{color:#e5bd59}
main{max-width:1100px;margin:auto;padding:15px}
.card{background:#151a25;border:1px solid #49402e;border-radius:12px;padding:18px;margin:12px 0}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:7px;border:1px solid #444;background:#090d16;color:white}
button{background:#b58b32;color:#080b12;font-weight:bold;cursor:pointer}
.secondary{background:#303746;color:white}
.danger{background:#9d3434;color:white}
.hidden{display:none}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{width:auto;flex:1}
.stat{font-size:26px;color:#e5bd59;font-weight:bold}
.gamegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.game{background:#202635;border:1px solid #b58b32;padding:25px 10px;text-align:center;border-radius:12px}
#message{color:#e5bd59;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h1>ROYAL EXCHANGE PRO</h1>
ULTIMATE EXCHANGE MANAGEMENT SYSTEM
</header>
<main>
<div id="message"></div>

<section id="login" class="card">
<h2 class="gold">Welcome</h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<button class="secondary" onclick="register()">CREATE DEMO ACCOUNT</button>
</section>

<section id="dashboard" class="hidden">
<nav id="navigation"></nav>

<div id="home" class="card">
<h2 class="gold">Dashboard</h2>
<p>Account Balance</p>
<div class="stat" id="balance">10000</div>
<p>Virtual Demo Credits</p>
</div>

<div id="games" class="card">
<h2 class="gold">Casino Games</h2>
<div class="gamegrid">
<div class="game">
<h3>🎰 SLOT MACHINE</h3>
<button onclick="playSlot()">PLAY</button>
</div>
<div class="game">
<h3>🎲 DICE GAME</h3>
<button onclick="playDice()">PLAY</button>
</div>
<div class="game">
<h3>🃏 CARD GAME</h3>
<button onclick="playCard()">PLAY</button>
</div>
<div class="game">
<h3>🎯 LUCKY NUMBER</h3>
<button onclick="playLucky()">PLAY</button>
</div>
</div>
</div>

<div id="wallet" class="card">
<h2 class="gold">Demo Wallet</h2>
<input id="amount" type="number" placeholder="Enter demo credits">
<button onclick="addCredits()">ADD DEMO CREDITS</button>
<button class="secondary" onclick="withdraw()">DEMO WITHDRAW REQUEST</button>
<p id="walletMessage"></p>
</div>

<div id="admin" class="card hidden">
<h2 class="gold">Admin Panel</h2>
<p>Total Users: <span id="users">0</span></p>
<button onclick="showUsers()">VIEW USERS</button>
<div id="userList"></div>
</div>

<div id="history" class="card">
<h2 class="gold">Game History</h2>
<div id="records"></div>
</div>

<button class="danger" onclick="logout()">LOGOUT</button>
</section>
</main>

<script>
let accounts=JSON.parse(localStorage.getItem("royalAccounts")||"{}");
let current="";
let isAdmin=false;
let credits=10000;

function save(){
 localStorage.setItem("royalAccounts",JSON.stringify(accounts));
}
function message(t){
 document.getElementById("message").textContent=t;
}
function register(){
 let u=prompt("Create username");
 if(!u)return;
 let p=prompt("Create password");
 if(!p)return;
 if(accounts[u])return message("Username already exists");
 accounts[u]={password:p,balance:10000,history:[]};
 save();
 message("Demo account created. Login now.");
}
function login(){
 let u=document.getElementById("username").value.trim();
 let p=document.getElementById("password").value;
 if(u==="admin"&&p==="admin123"){
 current=u;isAdmin=true;openDashboard();return;
 }
 if(!accounts[u]||accounts[u].password!==p)
 return message("Invalid login");
 current=u;isAdmin=false;openDashboard();
}
function openDashboard(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 let nav=document.getElementById("navigation");
 nav.innerHTML="";
 ["home","games","wallet","history"].forEach(x=>{
 let b=document.createElement("button");
 b.textContent=x.toUpperCase();
 b.onclick=()=>show(x);
 nav.appendChild(b);
 });
 if(isAdmin){
 let b=document.createElement("button");
 b.textContent="ADMIN";
 b.onclick=()=>show("admin");
 nav.appendChild(b);
 }
 refresh();
 show("home");
}
function show(id){
 ["home","games","wallet","admin","history"].forEach(x=>{
 document.getElementById(x).classList.add("hidden");
 });
 document.getElementById(id).classList.remove("hidden");
}
function refresh(){
 if(!isAdmin){
 document.getElementById("balance").textContent=accounts[current].balance.toFixed(2);
 document.getElementById("records").innerHTML=
 accounts[current].history.map(x=>"<p>"+x+"</p>").join("");
 }
}
function play(type){
 if(isAdmin)return message("Admin cannot play games");
 let a=accounts[current];
 let bet=Number(prompt("Enter demo credits to play"));
 if(!Number.isFinite(bet)||bet<=0||bet>10000)return;
 if(bet>a.balance)return message("Insufficient demo credits");
 let won=Math.random()>.5;
 let result=won?bet:-bet;
 a.balance+=result;
 a.history.unshift(type+": "+(won?"WIN +":"LOSS ")+Math.abs(result));
 save();refresh();
 alert(type+": "+(won?"DEMO WIN!":"DEMO LOSS!"));
}
function playSlot(){play("Slot Machine")}
function playDice(){play("Dice Game")}
function playCard(){play("Card Game")}
function playLucky(){play("Lucky Number")}
function addCredits(){
 if(isAdmin)return;
 let n=Number(document.getElementById("amount").value);
 if(!Number.isFinite(n)||n<=0||n>1000000)return message("Invalid amount");
 accounts[current].history.unshift("Demo credit request: "+n);
 save();refresh();
 document.getElementById("walletMessage").textContent="Demo credit request recorded. No real money added.";
}
function withdraw(){
 if(isAdmin)return;
 let n=Number(document.getElementById("amount").value);
 if(!Number.isFinite(n)||n<=0)return;
 accounts[current].history.unshift("Demo withdrawal request: "+n);
 save();refresh();
 document.getElementById("walletMessage").textContent="Demo withdrawal request recorded. No cash payout.";
}
function showUsers(){
 if(!isAdmin)return;
 document.getElementById("users").textContent=Object.keys(accounts).length;
 document.getElementById("userList").innerHTML=Object.keys(accounts).map(u=>
 "<p>"+u+" — "+accounts[u].balance.toFixed(2)+" demo credits</p>"
 ).join("");
}
function logout(){
 current="";isAdmin=false;
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 message("Logged out");
}
</script>
</body>
</html>
